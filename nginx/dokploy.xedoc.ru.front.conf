server {
    listen 80;
    listen [::]:80;

    server_name dokploy.xedoc.ru;

    access_log /var/log/nginx/dokploy.xedoc.ru.access.log;
    error_log /var/log/nginx/dokploy.xedoc.ru.error.log;

    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dokploy.xedoc.ru;

    ssl_certificate /etc/letsencrypt/live/dokploy.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokploy.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/dokploy.xedoc.ru.access.log;
    error_log /var/log/nginx/dokploy.xedoc.ru.error.log;

    client_max_body_size 100m;

    location / {
        proxy_pass http://132.243.118.214:3000;
        proxy_http_version 1.1;

        proxy_set_header Host dokploy.xedoc.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
